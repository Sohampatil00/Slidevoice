name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install studio and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check app tests
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Test presentation playback
        run: node --test tests/presentation.test.cjs
      - name: Run tests without AI providers
        run: python -m pytest -q
