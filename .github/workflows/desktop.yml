name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-installer]
  pull_request:
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/presentation.test.cjs
      - run: python -m pytest -q
      - name: Verify desktop branding and Python
        run: python -m ruff check app desktop scripts tests
      - run: python scripts/build_desktop.py
      - name: Smoke test macOS bundle
        if: runner.os == 'macOS'
        run: dist/SlideVoice.app/Contents/MacOS/SlideVoice --smoke-test
      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/SlideVoice/SlideVoice.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged backend failed: $($p.ExitCode)" }
      - name: Verify complete Windows dependency setup
        timeout-minutes: 30
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/SlideVoice/SlideVoice.exe -ArgumentList '--install-dependencies' -PassThru
          while (-not $p.WaitForExit(10000)) {
            Get-Content "$env:LOCALAPPDATA/SlideVoice/data/logs/desktop.log" -Tail 8 -ErrorAction SilentlyContinue
          }
          $p.Refresh()
          Get-Content "$env:LOCALAPPDATA/SlideVoice/data/logs/desktop.log" -Tail 50 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "LuxTTS installation failed: $($p.ExitCode)" }
      - name: Verify cached models and PowerPoint conversion offline
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/SlideVoice/SlideVoice.exe -ArgumentList '--verify-offline-setup' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/SlideVoice/data/logs/desktop.log" -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Offline setup verification failed: $($p.ExitCode)" }
      - name: Test Windows installer and preserved user data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_windows_installer.ps1
      - name: Collect Windows runtime logs
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .desktop-build/windows-runtime-logs | Out-Null
          Copy-Item "$env:LOCALAPPDATA/SlideVoice/data/logs/*" .desktop-build/windows-runtime-logs/ -ErrorAction SilentlyContinue
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SlideVoice-diagnostics-${{ runner.os }}
          include-hidden-files: true
          path: |
            .desktop-build/windows-installer-test/
            .desktop-build/windows-runtime-logs/
      - uses: actions/upload-artifact@v4
        with:
          name: SlideVoice-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Setup.exe
